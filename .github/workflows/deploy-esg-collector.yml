name: Deploy esg-collector (VM — DEPRECATED)

# SUPERSEDED by deploy-esg-collector-cloudrun.yml. The push trigger is removed
# so merging the Cloud Run migration does NOT also redeploy the VM (which would
# keep the VM producing competing per_ticker/web outputs into the same bucket).
# Kept as workflow_dispatch-only for emergency manual VM redeploys until the VM
# is decommissioned (see esg-collector/deploy/cloudrun/README.md Phase 5), then
# delete this file.
on:
  workflow_dispatch:
    inputs:
      run_rematch_all:
        description: "Also run pipeline.match --rematch-all after deploy (slow, ~5-15 min)"
        type: boolean
        default: false
      run_backfill:
        description: "Also enqueue the historical backfill (queue_builder --mode backfill) after deploy"
        type: boolean
        default: false

concurrency:
  group: deploy-esg-collector
  cancel-in-progress: false  # don't kill an in-flight deploy mid-pull
  # Op note: if a deploy hangs against a wedged VM, cancel that run before
  # re-triggering in a post-reset calm window — else this group queues the new
  # run behind the hung one (match.timer OnBootSec=10min may re-wedge first).

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # rematch-all can take ~15 min; old 15-min cap killed the job mid-rematch, leaving workers stopped
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: gen-lang-client-0020762472

      - name: Deploy + migrate on VM
        env:
          REMATCH: ${{ inputs.run_rematch_all && '1' || '0' }}
          # Backfill runs when manually dispatched OR when a push commit message
          # contains the [backfill] marker (lets a normal push trigger it once).
          BACKFILL: ${{ (inputs.run_backfill || contains(github.event.head_commit.message, '[backfill]')) && '1' || '0' }}
        run: |
          set -euo pipefail
          # Heredoc keeps the inner script as a single argv string so the
          # remote bash -s sees a stable script regardless of how the
          # outer YAML quoting renders.
          REMOTE_SCRIPT=$(cat <<'BASH'
          set -euo pipefail

          INSTALL_DIR=/opt/esg-collector
          APP_DIR=$INSTALL_DIR/esg-collector
          VENV=$INSTALL_DIR/.venv/bin/python
          DB=$APP_DIR/data/articles.db
          SVC_USER=esg

          # Safety net: no matter how this script exits (rematch error, job
          # timeout / SIGHUP from a killed SSH session), bring the workers back
          # up. Step 7 still does the authoritative start + active-check; this
          # only guards the case where we never reach step 7.
          restart_workers() {
            if [ "$REMATCH" = "1" ]; then
              echo "  (REMATCH=1: esg-rematch unit owns workers; deploy trap no-op)"
              return 0
            fi
            sudo systemctl start \
              esg-collector-google.service \
              esg-collector-baomoi.service \
              esg-collector-brave.service \
              esg-collector-body.service || true
          }
          trap restart_workers EXIT HUP TERM

          echo "=== 1. Stop workers ==="
          if [ "$REMATCH" != "1" ]; then
            # Also stop the match timer + any in-flight matcher so the deploy
            # never races a 6h/boot match (which, on the OLD non-chunked code +
            # a big 'pending' backlog, is what OOM-wedges the VM and hangs SSH).
            sudo systemctl stop esg-collector-match.timer esg-collector-match.service 2>/dev/null || true
            sudo systemctl stop \
              esg-collector-google.service \
              esg-collector-baomoi.service \
              esg-collector-brave.service \
              esg-collector-body.service
          else
            echo "  (REMATCH=1: managed rematch unit owns worker + match-timer stop/start; skipping)"
          fi

          echo "=== 2. Backup DB (rolling 7 daily snapshots) ==="
          sudo install -d -o $SVC_USER -g $SVC_USER $APP_DIR/data/backups
          sudo -u $SVC_USER cp -p $DB $APP_DIR/data/backups/articles.db.$(date +%u)
          ls -lh $APP_DIR/data/backups/

          echo "=== 3. git pull ==="
          cd $INSTALL_DIR
          sudo -u $SVC_USER git fetch origin main
          BEFORE=$(sudo -u $SVC_USER git rev-parse HEAD)
          sudo -u $SVC_USER git reset --hard origin/main
          AFTER=$(sudo -u $SVC_USER git rev-parse HEAD)
          echo "HEAD: $BEFORE -> $AFTER"

          echo "=== 4. init_db (auto ADD COLUMN cached_hits + indexes) ==="
          cd $APP_DIR
          sudo -u $SVC_USER $VENV -c "from core import storage; storage.init_db(); print('init_db OK')"

          echo "=== 4b. Sync systemd unit files + daemon-reload (apply resource caps) ==="
          # Deploy previously only git-reset the app code; unit files were frozen
          # at whatever install.sh last wrote. Re-install them every deploy so
          # MemoryMax/CPUQuota/Nice edits to the units actually take effect.
          sudo install -m 644 $APP_DIR/deploy/esg-collector-*.service $APP_DIR/deploy/esg-collector-*.timer /etc/systemd/system/
          sudo systemctl daemon-reload

          echo "=== 5. Normalize legacy timestamps (idempotent, via Python sqlite3) ==="
          # VM has no sqlite3 CLI; use the venv's stdlib sqlite3 module instead.
          sudo -u $SVC_USER $VENV - <<PYEOF
          import sqlite3
          conn = sqlite3.connect("$DB", timeout=30)
          stmts = [
              ("articles","fetched_at"), ("articles","matched_at"),
              ("search_queue","next_attempt"), ("search_queue","done_at"),
              ("url_decode_cache","attempted_at"),
          ]
          total = 0
          for t,c in stmts:
              n = conn.execute(
                  f"UPDATE {t} SET {c}=REPLACE({c},' ','T')||'Z' "
                  f"WHERE {c} NOT LIKE '%T%' AND {c} IS NOT NULL"
              ).rowcount
              print(f"  {t}.{c}: {n} rows normalized")
              total += n
          conn.commit()
          left_a = conn.execute("SELECT COUNT(*) FROM articles WHERE fetched_at NOT LIKE '%T%' AND fetched_at IS NOT NULL").fetchone()[0]
          left_q = conn.execute("SELECT COUNT(*) FROM search_queue WHERE next_attempt NOT LIKE '%T%' AND next_attempt IS NOT NULL").fetchone()[0]
          print(f"total normalized={total}  remaining legacy: articles={left_a} queue={left_q}")
          conn.close()
          PYEOF

          echo "=== 6. Smoke import (catch obvious code errors before restarting workers) ==="
          sudo -u $SVC_USER $VENV -c "from pipeline import match, export; from workers import body_fetcher, runner; from body_fetcher import jina; print('imports OK')"

          if [ "$REMATCH" = "1" ]; then
            echo "=== 6b. Launch DETACHED managed rematch (fire-and-return) ==="
            # Resource caps so the detached rematch can grind for as long as it
            # needs (no CI timeout — fire-and-return) without OOM-wedging the box:
            #  MemoryMax  → cgroup-OOM-kill a runaway instead of the kernel taking
            #               down sshd/guest-agent (workers are stopped, so more
            #               headroom than the periodic match.service).
            #  CPUQuota/Nice/IO → keep the VM SSH-responsive; rematch just runs slower.
            sudo systemd-run --no-block --collect --unit=esg-rematch \
              --property=MemoryHigh=450M \
              --property=MemoryMax=600M \
              --property=CPUQuota=70% \
              --property=Nice=15 \
              --property=IOSchedulingClass=idle \
              "$APP_DIR/deploy/rematch_managed.sh"
            echo "  launched esg-rematch unit; it owns worker lifecycle, deploy returns now"
            sleep 2
            state=$(systemctl is-active esg-rematch 2>/dev/null || true)
            echo "  esg-rematch unit: $state"
            [ "$state" = "failed" ] && { echo "rematch unit failed to start"; exit 1; }
          fi

          echo "=== 7. Restart workers ==="
          if [ "$REMATCH" != "1" ]; then
            sudo systemctl start \
              esg-collector-google.service \
              esg-collector-baomoi.service \
              esg-collector-brave.service \
              esg-collector-body.service
            sleep 3
            for s in google baomoi brave body; do
              state=$(systemctl is-active esg-collector-$s.service)
              echo "  $s: $state"
              [ "$state" = "active" ] || { echo "WORKER FAILED TO START: $s"; exit 1; }
            done
            # Re-arm the 6h match timer we stopped in step 1 (now under MemoryMax,
            # so even an old-style big-backlog match can't wedge the VM anymore).
            sudo systemctl start esg-collector-match.timer
          else
            echo "  (REMATCH=1: workers managed by esg-rematch unit)"
          fi

          if [ "$BACKFILL" = "1" ]; then
            echo "=== 7b. Backfill enqueue (historical alias + keyword; idempotent) ==="
            # Aliases were refreshed by the git reset in step 3; missing-alias
            # tickers are skipped with a warning, not an error.
            sudo -u $SVC_USER $VENV -m core.queue_builder --mode backfill
          fi

          echo "=== 8. Queue stats ==="
          sudo -u $SVC_USER $VENV - <<PYEOF
          import sqlite3
          conn = sqlite3.connect("$DB", timeout=30)
          for row in conn.execute("SELECT backend, status, COUNT(*) FROM search_queue GROUP BY backend, status ORDER BY backend, status"):
              print(f"  {row[0]:12s} {row[1]:12s} {row[2]}")
          conn.close()
          PYEOF

          echo "=== DONE $(date -Iseconds) ==="
          BASH
          )

          gcloud compute ssh esg-collector \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --quiet \
            --command="REMATCH=${REMATCH} BACKFILL=${BACKFILL} bash -s" <<< "$REMOTE_SCRIPT"
